name: Copia cifrada de Tortillas
on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * *'
permissions:
  contents: read
concurrency:
  group: copia-d1
  cancel-in-progress: false
jobs:
  copiar:
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exportar, cifrar y ensayar la recuperación
        run: node cloud/herramientas/copias.js crear copia-d1.enc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: copia-d1-${{ github.run_id }}
          path: copia-d1.enc
          retention-days: 30
          if-no-files-found: error
